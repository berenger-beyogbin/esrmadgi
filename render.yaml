services:
  - type: web
    name: madgi-esr-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_AUTH
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_USERNAME
        sync: false
      - key: SMS_API_PASSWORD
        sync: false
      - key: SMS_API_SERVICE_ID
        sync: false
      - key: FIRST_LOGIN_FIXED_OTP
        sync: false
      - key: FIRST_LOGIN_SMS_STANDBY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: SIAPS_BASE_URL
        sync: false
      - key: SIAPS_SLUG
        sync: false
      - key: SIAPS_EMAIL
        sync: false
      - key: SIAPS_PASSWORD
        sync: false

  - type: web
    name: madgi-esr-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
